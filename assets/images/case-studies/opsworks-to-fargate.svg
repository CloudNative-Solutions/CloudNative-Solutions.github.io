
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="ow_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001B33"></stop><stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>
    <pattern id="ow_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0086FF" stroke-width="0.4" opacity=".15"></path>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#ow_bg)"></rect>
  <rect width="600" height="360" fill="url(#ow_grid)"></rect>

  <text x="40" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#93EAFF" letter-spacing="2">CASE STUDY</text>
  <text x="40" y="68" font-family="var(--font-sans), system-ui" font-size="22" fill="#E2E8F0" font-weight="700">OpsWorks → Fargate</text>

  
  <g transform="translate(60 130)" opacity=".7">
    <text x="90" y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" letter-spacing="2">CHEF COOKBOOKS</text>
    
    <g fill="#0A0F1C" stroke="rgba(50,108,229,.5)" stroke-width="1">
      <rect x="0" y="0" width="180" height="22" rx="3"></rect>
      <rect x="0" y="28" width="180" height="22" rx="3"></rect>
      <rect x="0" y="56" width="180" height="22" rx="3"></rect>
      <rect x="0" y="84" width="180" height="22" rx="3"></rect>
      <rect x="0" y="112" width="180" height="22" rx="3"></rect>
      <rect x="0" y="140" width="180" height="22" rx="3"></rect>
    </g>
    <g font-family="ui-monospace, monospace" font-size="8" fill="#4B5873">
