    <g transform="translate(0 8)">
      <rect width="336" height="8" fill="rgba(50,108,229,.1)"></rect>
      <rect width="220" height="8" fill="#0086FF" opacity=".8"></rect>
      <text x="0" y="-1" font-size="6" fill="#4B5873">gateway 220ms</text>
    </g>
    <g transform="translate(20 22)">
