      <circle cx="35" cy="25" r="8" fill="none" stroke="#93EAFF" stroke-width="1.5"></circle>
      <path d="M30 25 h10 M35 20 v10" stroke="#93EAFF" stroke-width="1.5"></path>
      <text x="35" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">git commit</text>
    </g>

    
    <g transform="translate(85 30)">
      <rect x="0" y="0" width="70" height="60" rx="8" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.5"></rect>
