{{ define "main" }}
<section class="pt-32 pb-16 hero-gradient relative">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 relative z-10">
    <h1 class="text-3xl sm:text-4xl font-bold dark:text-surface-50 text-surface-900 mb-4">{{ .Title }}</h1>
  </div>
  <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-surface-950 to-transparent"></div>
</section>

<section class="py-12 pb-24">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="glass-card rounded-xl overflow-hidden group reveal p-6">
        <h3 class="text-lg font-semibold dark:text-surface-100 text-surface-800 mb-2 group-hover:text-brand-300 transition-colors">{{ .Title }}</h3>
        {{ with .Description }}
        <p class="text-sm dark:text-surface-400 text-surface-500">{{ . }}</p>
        {{ end }}
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
