{{ define "main" }}

<section class="pt-32 pb-12 hero-gradient relative">
  <div class="max-w-4xl mx-auto px-6 lg:px-8 relative z-10">
    <nav class="mb-6 flex items-center gap-2 text-sm text-surface-500">
      <a href="{{ "/" | relURL }}" class="hover:text-surface-300 transition-colors">Home</a>
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      <a href="{{ "services/" | relURL }}" class="hover:text-surface-300 transition-colors">Services</a>
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      <span class="text-surface-400">{{ .Title }}</span>
    </nav>
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-surface-50 mb-4">{{ .Title }}</h1>
  </div>
  <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-surface-950 to-transparent"></div>
</section>

{{ if .Params.image }}
<div class="max-w-5xl mx-auto px-6 lg:px-8 mt-6 mb-8">
  <div class="rounded-xl overflow-hidden border border-surface-800/50 aspect-video">
    <img src="{{ .Params.image }}" alt="{{ .Title }}" class="w-full h-full object-cover">
  </div>
</div>
{{ end }}

<section class="pb-20">
  <div class="max-w-4xl mx-auto px-6 lg:px-8">
    <article class="prose-dark max-w-none space-y-4">
      {{ .Content }}
    </article>

    {{/* CTA */}}
    <div class="mt-12 p-8 glass-card rounded-xl text-center">
      <h3 class="text-xl font-semibold text-surface-100 mb-2">Ready to get started?</h3>
      <p class="text-surface-400 mb-5 text-sm">Let's discuss how we can help with your {{ .Title }} needs.</p>
      <a href="{{ "contact/" | relURL }}" class="btn-glow px-6 py-3 rounded-lg text-white font-medium text-sm inline-flex items-center gap-2">
        Contact Us
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
      </a>
    </div>

    <div class="mt-8">
      <a href="{{ "services/" | relURL }}" class="inline-flex items-center gap-2 text-brand-400 hover:text-brand-300 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        All Services
      </a>
    </div>
  </div>
</section>

{{ end }}
