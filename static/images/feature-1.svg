  <text x="40" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#0086FF" letter-spacing="2">GITOPS PIPELINE</text>
  <text x="40" y="55" font-family="var(--font-sans), system-ui" font-size="14" fill="#E2E8F0" font-weight="600">Commit to production in minutes.</text>
  <text x="40" y="245" font-family="ui-monospace, monospace" font-size="9" fill="#4B5873">// argocd · github actions · lgtm</text>
