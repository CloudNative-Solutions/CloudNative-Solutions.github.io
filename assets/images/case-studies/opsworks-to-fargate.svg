    <text x="26" y="-12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#93EAFF" letter-spacing="1">CONTAINERIZE</text>
  </g>

  
  <g transform="translate(360 130)">
    <text x="90" y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#93EAFF" letter-spacing="2">CONTAINER · FARGATE</text>
    
    <rect width="180" height="170" rx="10" fill="#0A0F1C" stroke="#93EAFF" stroke-width="1.5"></rect>

    
    <g transform="translate(20 24)" font-family="ui-monospace, monospace" font-size="9">
      <text fill="#93EAFF" y="0">FROM</text><text x="36" y="0" fill="#E2E8F0">python:slim</text>
      <text fill="#93EAFF" y="14">COPY</text><text x="36" y="14" fill="#E2E8F0">. /app</text>
      <text fill="#93EAFF" y="28">RUN</text><text x="36" y="28" fill="#E2E8F0">pip install</text>
      <text fill="#93EAFF" y="42">CMD</text><text x="36" y="42" fill="#E2E8F0">gunicorn ...</text>
    </g>

    
    <g transform="translate(20 100)">
      <rect width="44" height="44" rx="6" fill="rgba(50,108,229,.1)" stroke="#0086FF"></rect>
      <rect x="56" width="44" height="44" rx="6" fill="rgba(50,108,229,.1)" stroke="#0086FF"></rect>
      <rect x="112" width="44" height="44" rx="6" fill="rgba(50,108,229,.1)" stroke="#0086FF"></rect>
