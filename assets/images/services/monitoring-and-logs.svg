
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001B33"></stop><stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>
    <pattern id="mgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0086FF" stroke-width="0.4" opacity=".15"></path>
    </pattern>
    <linearGradient id="marea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0086FF" stop-opacity=".5"></stop>
      <stop offset="100%" stop-color="#0086FF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#mbg)"></rect>
  <rect width="400" height="300" fill="url(#mgrid)"></rect>

  <text x="32" y="40" font-family="ui-monospace, monospace" font-size="9" fill="#0086FF" letter-spacing="2">MONITORING &amp; LOGS</text>

  
  <g transform="translate(32 64)">
    <rect width="336" height="120" rx="8" fill="#0A0F1C" stroke="rgba(50,108,229,.25)" stroke-width="1"></rect>
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="8" fill="#4B5873">request rate · last 1h</text>
    <text x="324" y="18" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#93EAFF">1.2k rps</text>

    
    <g stroke="rgba(50,108,229,.08)" stroke-width="0.5">
      <line x1="0" y1="50" x2="336" y2="50"></line>
      <line x1="0" y1="80" x2="336" y2="80"></line>
      <line x1="0" y1="100" x2="336" y2="100"></line>
    </g>

    
    <polyline points="0,90 24,75 48,82 72,65 96,72 120,55 144,68 168,42 192,58 216,38 240,52 264,32 288,48 312,30 336,40 336,120 0,120" fill="url(#marea)"></polyline>
    <polyline points="0,90 24,75 48,82 72,65 96,72 120,55 144,68 168,42 192,58 216,38 240,52 264,32 288,48 312,30 336,40" fill="none" stroke="#93EAFF" stroke-width="1.5"></polyline>

    
    <g transform="translate(264 32)">
      <circle r="3" fill="#93EAFF"></circle>
      <circle r="6" fill="none" stroke="#93EAFF" stroke-width="1" opacity=".5"></circle>
    </g>
  </g>

  
  <g transform="translate(32 200)" font-family="ui-monospace, monospace" font-size="7" fill="#94A3B8">
