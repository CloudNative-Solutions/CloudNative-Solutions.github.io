
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="cnbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001B33"></stop><stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>
    <pattern id="cngrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0086FF" stroke-width="0.4" opacity=".15"></path>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#cnbg)"></rect>
  <rect width="400" height="300" fill="url(#cngrid)"></rect>

  <text x="32" y="40" font-family="ui-monospace, monospace" font-size="9" fill="#0086FF" letter-spacing="2">CONTAINER SOLUTIONS</text>

  
  <g transform="translate(200 170)">
    
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 0)">
      
      <g>
        <rect x="-60" y="-60" width="50" height="50" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.2"></rect>
        <rect x="-5" y="-60" width="50" height="50" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.2"></rect>
        <rect x="-60" y="-5" width="50" height="50" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.2"></rect>
        <rect x="-5" y="-5" width="50" height="50" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.2"></rect>

        <rect x="-32" y="-95" width="50" height="50" fill="#0A0F1C" stroke="#93EAFF" stroke-width="1.5"></rect>

        
        <line x1="-55" y1="-50" x2="-15" y2="-50" stroke="#93EAFF" stroke-width="1" opacity=".6"></line>
        <line x1="0" y1="-50" x2="40" y2="-50" stroke="#93EAFF" stroke-width="1" opacity=".6"></line>
        <line x1="-55" y1="5" x2="-15" y2="5" stroke="#93EAFF" stroke-width="1" opacity=".6"></line>
        <line x1="0" y1="5" x2="40" y2="5" stroke="#93EAFF" stroke-width="1" opacity=".6"></line>
        <line x1="-27" y1="-85" x2="13" y2="-85" stroke="#93EAFF" stroke-width="1" opacity=".8"></line>
      </g>
    </g>

    
    <ellipse rx="120" ry="34" fill="none" stroke="#0086FF" stroke-width="1" opacity=".3" stroke-dasharray="2 4"></ellipse>
  </g>

  
  <g font-family="ui-monospace, monospace" font-size="8" fill="#93EAFF">
    <text x="40" y="100">helm</text>
    <text x="350" y="100" text-anchor="end">istio</text>
    <text x="40" y="240">cilium</text>
    <text x="350" y="240" text-anchor="end">trivy</text>
