<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="f1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001B33"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>
    <pattern id="f1grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0086FF" stroke-width="0.4" opacity=".2"></path>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#f1bg)"></rect>
  <rect width="400" height="300" fill="url(#f1grid)"></rect>

  
  <g transform="translate(40 90)">
    
    <line x1="0" y1="60" x2="320" y2="60" stroke="#0086FF" stroke-width="1" stroke-dasharray="3 3" opacity=".5"></line>

    
    <g transform="translate(0 30)">
