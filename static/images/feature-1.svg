      <text x="35" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">build</text>
    </g>

    
    <g transform="translate(170 30)">
      <rect x="0" y="0" width="70" height="60" rx="8" fill="#0A0F1C" stroke="#0086FF" stroke-width="1.5"></rect>
