{{ define "main" }}

{{/* Hero */}}
<section class="pt-32 pb-16 hero-gradient relative">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 relative z-10">
    <div class="max-w-2xl">
      <p class="text-brand-400 font-medium text-sm uppercase tracking-wider mb-3">Real-World Results</p>
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold dark:text-surface-50 text-surface-900 mb-4">Case Studies</h1>
      <p class="text-lg dark:text-surface-400 text-surface-500">How we've helped companies modernize their cloud infrastructure and accelerate delivery.</p>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t dark:from-surface-950 from-white to-transparent"></div>
</section>

<section class="py-16 pb-24">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      {{ range .Pages }}
      <a href="{{ .Permalink }}" class="glass-card rounded-xl overflow-hidden group reveal flex flex-col">
        {{ if .Params.image }}
        <div class="aspect-video overflow-hidden">
          <img src="{{ .Params.image }}" alt="{{ .Title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        </div>
        {{ end }}
        <div class="p-6 flex flex-col flex-1">
          <h3 class="text-xl font-semibold dark:text-surface-100 text-surface-800 mb-3 group-hover:text-brand-300 transition-colors leading-snug">{{ .Title }}</h3>
          <p class="text-sm dark:text-surface-400 text-surface-500 line-clamp-3 flex-1">{{ .Description }}</p>
          <div class="mt-5 flex items-center text-brand-400 text-sm font-medium">
            Read case study
            <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </div>
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>

{{ end }}
