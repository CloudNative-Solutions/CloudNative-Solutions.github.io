      <circle cx="35" cy="29" r="3" fill="#93EAFF"></circle>
      <text x="35" y="54" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">deploy</text>
    </g>

    
    <g transform="translate(255 30)">
      <rect x="0" y="0" width="70" height="60" rx="8" fill="#0A0F1C" stroke="#93EAFF" stroke-width="1.5"></rect>
