      <text x="10" y="70">recipes/nginx.rb</text>
      <text x="10" y="98">recipes/postgres.rb</text>
      <text x="10" y="126">recipes/celery.rb</text>
      <text x="10" y="154">recipes/deploy.rb</text>
    </g>
    
    <g fill="#0086FF">
      <circle cx="170" cy="11" r="2"></circle>
      <circle cx="170" cy="39" r="2"></circle>
      <circle cx="170" cy="67" r="2"></circle>
      <circle cx="170" cy="95" r="2"></circle>
      <circle cx="170" cy="123" r="2"></circle>
      <circle cx="170" cy="151" r="2"></circle>
    </g>
