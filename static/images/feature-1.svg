      <text x="35" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">observe</text>
    </g>

    
    <g fill="#0086FF">
      <polygon points="75,57 82,60 75,63"></polygon>
      <polygon points="160,57 167,60 160,63"></polygon>
      <polygon points="245,57 252,60 245,63"></polygon>
